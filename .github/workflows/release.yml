name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const version = require("./manifest.json").version;
            if (tag !== version) {
              throw new Error(`tag v${tag} does not match manifest.json version ${version}`);
            }
          '

      - name: Build extension zip
        run: |
          zip -r "chattrrimer-${GITHUB_REF_NAME}.zip" \
            manifest.json popup.html popup.css styles.css \
            src icons fonts _locales LICENSE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: chattrrimer-*.zip
          generate_release_notes: true
