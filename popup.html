<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatTrimmer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">CT</span>
        <span class="brand-name">ChatTrimmer</span>
      </div>
      <button class="icon-btn" id="refreshBtn" type="button" title="Làm mới số liệu" aria-label="Làm mới">↻</button>
    </header>

    <section class="hero">
      <div class="hero-halo" aria-hidden="true"></div>
      <span class="hero-number" id="hiddenCount">0</span>
      <span class="hero-label">tin đang được ẩn</span>
    </section>

    <div class="hero-actions">
      <button class="btn btn-primary" id="revealBtn" type="button">Hiện hết</button>
      <button class="btn btn-secondary" id="exportCsvBtn" type="button">Xuất CSV</button>
    </div>

    <div class="divider"></div>

    <section class="panel">
      <div class="row">
        <div class="row-text">
          <span class="row-title">Tự động ẩn</span>
          <p class="row-sub">Ẩn tin cũ để trang nhẹ hơn</p>
        </div>
        <label class="switch">
          <input type="checkbox" id="autoHideToggle">
          <span class="switch-track"></span>
        </label>
      </div>

      <div class="row column">
        <div class="row-text">
          <span class="row-title">Giữ lại</span>
          <p class="row-sub">Số tin gần nhất hiển thị (10–200)</p>
        </div>
        <input type="number" id="maxMessages" class="text-input" min="10" max="200" value="10">
      </div>

      <div class="row column">
        <div class="row-text">
          <span class="row-title">Show More</span>
          <p class="row-sub">Số tin hiện thêm mỗi lần (5–50)</p>
        </div>
        <input type="number" id="showMoreCount" class="text-input" min="5" max="50" value="5">
      </div>

      <div class="row column">
        <div class="row-text">
          <span class="row-title">Nền tảng</span>
          <p class="row-sub">Bật/tắt nơi ChatTrimmer hoạt động</p>
        </div>
        <div class="chips" id="platformChips">
          <button class="chip" type="button" data-site="chatgpt">ChatGPT</button>
          <button class="chip" type="button" data-site="claude">Claude</button>
          <button class="chip" type="button" data-site="grok">Grok</button>
          <button class="chip" type="button" data-site="aistudio">AI Studio</button>
        </div>
      </div>
    </section>

    <div class="divider"></div>

    <footer class="summary">
      <div class="summary-counts">
        <span><b id="statUser">0</b> bạn</span>
        <span class="dot">·</span>
        <span><b id="statAi">0</b> AI</span>
        <span class="dot">·</span>
        <span><b id="statTotal">0</b> tổng</span>
      </div>
      <span class="platform-tag" id="currentPlatform">—</span>
    </footer>

    <div class="toast" id="toast" role="status"></div>
  </div>

  <script src="src/popup.js"></script>
</body>
</html>
