name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate manifest.json
        run: |
          node -e '
            const m = require("./manifest.json");
            for (const k of ["manifest_version", "name", "version", "icons"]) {
              if (m[k] == null) throw new Error("manifest.json is missing: " + k);
            }
            console.log("manifest.json OK — " + m.name + " v" + m.version);
          '

      - name: Syntax-check JS
        run: for f in src/*.js; do node --check "$f"; done
