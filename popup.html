<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatTrimmer</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div>

    <!-- Header & state -->
    <header class="head">
      <div class="head-text">
        <h1 class="thread-title">
          <span id="threadTitle">ChatGPT</span>
          <span class="dot dot-live" id="statusDot"></span>
        </h1>
        <p class="head-sub" id="headSub">Đang gấp tin nhắn cũ</p>
      </div>
      <button class="state-pill" id="statePill" type="button">Active</button>
    </header>

    <!-- Fold map -->
    <section class="fold-map" id="foldSection">
      <div class="fold-map-head">
        <span class="label">Conversation Fold Map</span>
        <span class="label accent" id="foldCount">0 folds</span>
      </div>

      <div class="folds" id="folds"></div>

      <div class="tail-card">
        <div class="tail-head">
          <span class="dot dot-live"></span>
          <span class="tail-title">Active Tail: <span id="tailCount">0</span> tin cuối</span>
          <span class="tag" id="tailTag">Visible</span>
        </div>
        <p class="tail-desc" id="tailDesc">Chưa có tin nhắn nào bị gấp.</p>
        <button class="btn-primary" id="unfoldAllBtn" type="button">
          <span>Mở toàn bộ cuộc trò chuyện</span>
          <span class="btn-meta" id="unfoldMeta">(0 tin)</span>
        </button>
      </div>
    </section>

    <!-- Trim stepper -->
    <section class="stepper">
      <div class="stepper-head">
        <span class="stepper-label">Tail Window Size</span>
        <span class="mono accent" id="tailValue">30 tin</span>
      </div>
      <input type="range" id="tailRange" min="10" max="100" step="5" value="30" aria-label="Số tin giữ lại">
      <div class="stepper-scale">
        <span>Gọn (10)</span>
        <span>Chuẩn (30)</span>
        <span>Rộng (100)</span>
      </div>
    </section>

    <!-- Sender stats -->
    <section class="stats-row">
      <div class="stat"><span class="dot dot-user"></span><span class="mono" id="statUser">Bạn: 0 (0%)</span></div>
      <div class="stat"><span class="dot dot-ai"></span><span class="mono" id="statAi">ChatGPT: 0 (0%)</span></div>
      <button class="link-btn" id="exportBtn" type="button">Export CSV</button>
    </section>

    <!-- Footer -->
    <footer class="foot">
      <span>Auto-trimming: <strong>ChatGPT</strong></span>
    </footer>

    <div class="toast" id="toast" role="status"></div>
  </div>

  <script src="src/popup.js"></script>
</body>
</html>
